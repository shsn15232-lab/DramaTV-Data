
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DramaTV Support</title>
</head>
<body>
<script>
const DESTINATION = "saadtv2027@gmail.com";

async function sendSupport(data) {
    const response = await fetch(
        "https://formsubmit.co/ajax/" + DESTINATION,
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                name: "DramaTV Support",
                _subject: data.subject || "رسالة دعم - DramaTV",
                message: data.message || ""
            })
        }
    );

    const result = await response.json();
    return result;
}

window.sendSupport = sendSupport;
</script>
</body>
</html>
