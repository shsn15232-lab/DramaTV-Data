
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DramaTV Support</title>
</head>
<body>

<script>
"use strict";

window.sendSupport = async function(data) {

    try {

        const response = await fetch(
            "https://formsubmit.co/ajax/saadtv2027@gmail.com",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    name: "DramaTV",
                    _subject: data.subject || "طلب دعم من DramaTV",
                    message: data.message || ""
                })
            }
        );

        const result = await response.json();

        const success =
            response.ok &&
            String(result.success).toLowerCase() === "true";

        if (
            window.DramaBridge &&
            typeof window.DramaBridge.onResult === "function"
        ) {
            window.DramaBridge.onResult(
                success,
                result.message || (
                    success
                    ? "تم إرسال الطلب بنجاح"
                    : "تعذر إرسال الطلب"
                )
            );
        }

    } catch (error) {

        if (
            window.DramaBridge &&
            typeof window.DramaBridge.onResult === "function"
        ) {
            window.DramaBridge.onResult(
                false,
                error.message || "حدث خطأ أثناء الاتصال"
            );
        }

    }

};
</script>

</body>
</html>
