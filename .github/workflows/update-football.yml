
name: Update DramaTV Football Data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-football:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch football data
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.request import Request, urlopen

          key = os.environ.get("FOOTBALL_API_KEY", "").strip()
          if not key:
              sys.exit("Missing FOOTBALL_API_KEY secret")

          base = "https://v3.football.api-sports.io"
          headers = {"x-apisports-key": key}
          baghdad = ZoneInfo("Asia/Baghdad")
          today = datetime.now(baghdad).date()

          def fetch(path, params):
              url = f"{base}{path}?{params}"
              request = Request(url, headers=headers)

              with urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode("utf-8"))

              if data.get("errors"):
                  raise RuntimeError(str(data["errors"]))

              return {
                  "updated_at": datetime.now(baghdad).isoformat(),
                  "response": data.get("response", [])
              }

          os.makedirs("football", exist_ok=True)

          live = fetch(
              "/fixtures",
              "live=all&timezone=Asia/Baghdad"
          )

          today_data = fetch(
              "/fixtures",
              f"date={today.isoformat()}&timezone=Asia/Baghdad"
          )

          tomorrow = today + timedelta(days=1)

          tomorrow_data = fetch(
              "/fixtures",
              f"date={tomorrow.isoformat()}&timezone=Asia/Baghdad"
          )

          datasets = {
              "football/live.json": live,
              "football/today.json": today_data,
              "football/upcoming.json": tomorrow_data
          }

          for path, data in datasets.items():
              with open(path, "w", encoding="utf-8") as file:
                  json.dump(
                      data,
                      file,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )

              print(f"{path}: {len(data['response'])} matches")

          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football/*.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update football data"
            git push
          fi
