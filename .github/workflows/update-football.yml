
name: Update DramaTV Football Data

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-football:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch football matches
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          key = os.environ.get("FOOTBALL_API_KEY", "").strip()

          if not key:
              sys.exit("Missing FOOTBALL_API_KEY secret")

          base = "https://v3.football.api-sports.io"
          headers = {"x-apisports-key": key}

          baghdad = ZoneInfo("Asia/Baghdad")
          now = datetime.now(baghdad)
          today = now.date()
          tomorrow = today + timedelta(days=1)

          def fetch(path, params):
              url = f"{base}{path}?{urlencode(params)}"
              request = Request(url, headers=headers)

              with urlopen(request, timeout=30) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )

              if data.get("errors"):
                  raise RuntimeError(str(data["errors"]))

              result = data.get("response", [])

              if not isinstance(result, list):
                  raise RuntimeError("Invalid API response")

              return result

          def save_json(path, data):
              os.makedirs(
                  os.path.dirname(path),
                  exist_ok=True
              )

              with open(path, "w", encoding="utf-8") as file:
                  json.dump(
                      data,
                      file,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )

          os.makedirs("football", exist_ok=True)

          # =====================================
          # LIVE MATCHES
          # =====================================

          print("Fetching live matches...")

          live = fetch(
              "/fixtures",
              {
                  "live": "all",
                  "timezone": "Asia/Baghdad"
              }
          )

          # =====================================
          # TODAY MATCHES
          # =====================================

          print("Fetching today's matches...")

          today_data = fetch(
              "/fixtures",
              {
                  "date": today.isoformat(),
                  "timezone": "Asia/Baghdad"
              }
          )

          # =====================================
          # TOMORROW MATCHES
          # =====================================

          print("Fetching tomorrow's matches...")

          tomorrow_data = fetch(
              "/fixtures",
              {
                  "date": tomorrow.isoformat(),
                  "timezone": "Asia/Baghdad"
              }
          )

          # =====================================
          # SAVE FOOTBALL DATA
          # =====================================

          datasets = {
              "football/live.json": live,
              "football/today.json": today_data,
              "football/upcoming.json": tomorrow_data
          }

          for path, response_data in datasets.items():

              save_json(
                  path,
                  {
                      "updated_at": now.isoformat(),
                      "response": response_data
                  }
              )

              print(
                  f"SUCCESS: {path} | "
                  f"Matches: {len(response_data)}"
              )

          print("=" * 50)
          print("Football matches updated successfully")
          print(f"Live: {len(live)}")
          print(f"Today: {len(today_data)}")
          print(f"Tomorrow: {len(tomorrow_data)}")
          print("=" * 50)

          PY

      - name: Commit updated football data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f football/live.json football/today.json football/upcoming.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update football matches"
            git push
          fi

  # =====================================
  # SPORTScore API TEST (INDEPENDENT)
  # =====================================

  test-sportscore:
    runs-on: ubuntu-latest

    steps:
      - name: Test SportScore statistics API
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          leagues = [
              {
                  "slug": "la-liga",
                  "name": "الدوري الإسباني"
              },
              {
                  "slug": "premier-league",
                  "name": "الدوري الإنجليزي"
              },
              {
                  "slug": "serie-a",
                  "name": "الدوري الإيطالي"
              },
              {
                  "slug": "bundesliga",
                  "name": "الدوري الألماني"
              },
              {
                  "slug": "ligue-1",
                  "name": "الدوري الفرنسي"
              }
          ]

          base = "https://sportscore.com/api/widget"

          def test_endpoint(endpoint, slug, extra=None):

              params = {
                  "sport": "football",
                  "slug": slug
              }

              if extra:
                  params.update(extra)

              url = (
                  f"{base}/{endpoint}/?"
                  f"{urlencode(params)}"
              )

              request = Request(
                  url,
                  headers={
                      "User-Agent": "DramaTV-Stats-Test/1.0",
                      "Accept": "application/json"
                  }
              )

              with urlopen(request, timeout=30) as response:

                  body = response.read().decode("utf-8")
                  data = json.loads(body)

                  print("HTTP:", response.status)
                  print("URL:", url)

                  print(
                      json.dumps(
                          data,
                          ensure_ascii=False
                      )[:3500]
                  )

                  return data

          for league in leagues:

              slug = league["slug"]

              print("\n" + "=" * 60)
              print("LEAGUE:", league["name"])
              print("SLUG:", slug)

              tests = [
                  ("standings", {}),
                  ("topscorers", {
                      "limit": 10,
                      "stat": "goals"
                  }),
                  ("topscorers", {
                      "limit": 10,
                      "stat": "assists"
                  })
              ]

              for endpoint, extra in tests:

                  print("\nENDPOINT:", endpoint, extra)

                  try:

                      test_endpoint(
                          endpoint,
                          slug,
                          extra
                      )

                      print("RESULT: SUCCESS")

                  except Exception as error:

                      print("RESULT: FAILED")
                      print("ERROR:", str(error))

          print("\n" + "=" * 60)
          print("SPORTSCORE TEST FINISHED")
          PY
